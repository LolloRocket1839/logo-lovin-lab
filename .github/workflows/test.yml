name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit-tests:
    name: Unit & snapshot tests
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (incl. investor-zone snapshots)
        # CI=true makes vitest fail instead of auto-writing snapshots,
        # so any change to validation error messages will block the PR
        # until snapshots are intentionally updated via:
        #   npm run test:snapshots:update
        run: npm run test:ci

      - name: Lint
        run: npm run lint

      - name: Validate translations (i18n)
        # Fails the pipeline on missing, extra, empty, or untranslated keys
        # across all locale bundles (main + investor). Reference: it.json.
        run: npm run validate:translations
